name: Build Flutter Trainer & Client APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # Step 1: Re-create Android files
      - name: Re-create Android Project Structure
        run: |
          cd mobile_apps/dog_trainer_app
          flutter create . --platforms=android --org com.dogtraining.app

      # Step 2: Inject Android Embedding V2 & Permissions BEFORE pub get
      - name: Inject AndroidManifest & Kotlin V2 Embedding
        run: |
          mkdir -p mobile_apps/dog_trainer_app/android/app/src/main/kotlin/com/dogtraining/app
          
          # 1. Create AndroidManifest.xml with Embedding V2 Tag
          cat << 'EOF' > mobile_apps/dog_trainer_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dogtraining.app">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Dog Trainer App"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 2. Create MainActivity.kt for V2 Embedding
          cat << 'EOF' > mobile_apps/dog_trainer_app/android/app/src/main/kotlin/com/dogtraining/app/MainActivity.kt
          package com.dogtraining.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      # Step 3: Upgrade minSdkVersion to 21 for Camera & Location
      - name: Update Gradle MinSDK
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' mobile_apps/dog_trainer_app/android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' mobile_apps/dog_trainer_app/android/app/build.gradle

      # Step 4: Install Dependencies (After V2 injection)
      - name: Install Dependencies
        run: |
          cd mobile_apps/dog_trainer_app
          flutter pub get

      # Step 5: Build Final Release APK
      - name: Build APK
        run: |
          cd mobile_apps/dog_trainer_app
          flutter build apk --release --no-tree-shake-icons

      # Step 6: Upload APK to Github Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dog-trainer-app-release
          path: mobile_apps/dog_trainer_app/build/app/outputs/flutter-apk/app-release.apk
          
